<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>つなぐマルシェ フォトフレーム（終了しました）</title>
<style>
  :root { --bg: #fbf3e4; --card: #fffaf1; --ink: #4a3426; --muted: #7a6355; --accent: #c8102e; --line: #ead8bd; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #221a14; --card: #2d231b; --ink: #f4e8d8; --muted: #c9b6a3; --accent: #ff6b6b; --line: #4a3a2d; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { width: 100%; max-width: 420px; padding: 40px 24px; text-align: center; line-height: 1.9;
    background: var(--card); border: 1px solid var(--line); border-radius: 20px; }
  .leaf { font-size: 40px; line-height: 1; margin-bottom: 16px; }
  .event { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
  h1 { margin: 0 0 24px; font-size: 22px; line-height: 1.6; }
  p { margin: 0; font-size: 16px; }
  .thanks { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--line); color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
  <main>
    <div class="leaf" aria-hidden="true">🍁</div>
    <p class="event">LINK 千葉つなぐマルシェ（2026.11.8）</p>
    <h1>フォトフレームの配布は<br>終了しました</h1>
    <p>たくさんのご利用、<br>ありがとうございました。</p>
    <p class="thanks">ご来場いただき、ありがとうございました！</p>
  </main>
</body>
</html>
